<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agujero Negro Interstellar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0a0e27 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        .container {
            position: relative;
            width: 600px;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* Grid de deformación del espacio-tiempo */
        .spacetime-grid {
            position: absolute;
            width: 800px;
            height: 800px;
            opacity: 0.3;
            pointer-events: none;
        }
        
        .grid-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 200, 0.3), transparent);
        }
        
        .grid-line-h {
            width: 100%;
            height: 1px;
        }
        
        .grid-line-v {
            width: 1px;
            height: 100%;
        }
        
        /* Disco de acreción conformado por corazones */
        .hearts-accretion {
            position: absolute;
            width: 500px;
            height: 500px;
            animation: spin 8s linear infinite;
        }
        
        .heart-accent {
            position: absolute;
            width: 25px;
            height: 25px;
            filter: drop-shadow(0 0 8px rgba(0, 255, 200, 0.8));
        }
        
        .heart-accent::before,
        .heart-accent::after {
            content: '';
            position: absolute;
            width: 25px;
            height: 37px;
            background: currentColor;
            border-radius: 25px 25px 0 0;
            left: 25px;
            top: 0;
        }
        
        .heart-accent::before {
            left: -12px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }
        
        .heart-accent::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }
        
        /* Segunda capa de corazones */
        .hearts-accretion-2 {
            position: absolute;
            width: 380px;
            height: 380px;
            animation: spin 10s linear infinite reverse;
        }
        
        .heart-accent-2 {
            position: absolute;
            width: 20px;
            height: 20px;
            filter: drop-shadow(0 0 6px rgba(0, 200, 255, 0.7));
        }
        
        .heart-accent-2::before,
        .heart-accent-2::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 30px;
            background: currentColor;
            border-radius: 20px 20px 0 0;
            left: 20px;
            top: 0;
        }
        
        .heart-accent-2::before {
            left: -10px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }
        
        .heart-accent-2::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }
        
        /* Tercera capa de corazones */
        .hearts-accretion-3 {
            position: absolute;
            width: 280px;
            height: 280px;
            animation: spin 12s linear infinite;
        }
        
        .heart-accent-3 {
            position: absolute;
            width: 15px;
            height: 15px;
            filter: drop-shadow(0 0 4px rgba(100, 200, 255, 0.6));
        }
        
        .heart-accent-3::before,
        .heart-accent-3::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 22px;
            background: currentColor;
            border-radius: 15px 15px 0 0;
            left: 15px;
            top: 0;
        }
        
        .heart-accent-3::before {
            left: -7px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }
        
        .heart-accent-3::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }
        
        /* Anillo de evento del horizonte */
        .event-horizon {
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle at 35% 35%, rgba(20, 50, 100, 0.9), rgba(5, 10, 30, 0.95), #000);
            border-radius: 50%;
            box-shadow: 
                0 0 40px rgba(0, 255, 200, 0.4),
                inset 0 0 40px rgba(0, 100, 150, 0.6),
                0 0 80px rgba(0, 200, 255, 0.2);
            filter: brightness(0.8);
            z-index: 10;
        }
        
        /* Animaciones */
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        
        @keyframes warp {
            0% {
                transform: scale(1) skew(0deg);
            }
            25% {
                transform: scale(1.05) skew(2deg);
            }
            50% {
                transform: scale(1) skew(0deg);
            }
            75% {
                transform: scale(0.95) skew(-2deg);
            }
            100% {
                transform: scale(1) skew(0deg);
            }
        }
        
        /* Texto de título */
        .title {
            position: absolute;
            top: 30px;
            font-size: 28px;
            color: rgba(0, 255, 200, 0.9);
            text-shadow: 0 0 20px rgba(0, 255, 200, 0.6);
            font-weight: bold;
            letter-spacing: 2px;
            z-index: 20;
        }
        
        .subtitle {
            position: absolute;
            bottom: 30px;
            font-size: 14px;
            color: rgba(0, 200, 255, 0.7);
            text-shadow: 0 0 10px rgba(0, 200, 255, 0.4);
            letter-spacing: 1px;
            z-index: 20;
        }

        /* Efecto de distorsión radial */
        .distortion-field {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle at center, 
                rgba(0, 255, 200, 0.05) 0%,
                rgba(0, 200, 255, 0.02) 30%,
                transparent 70%);
            border-radius: 50%;
            filter: blur(30px);
            pointer-events: none;
            animation: distort 3s ease-in-out infinite;
        }

        @keyframes distort {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Grid de deformación del espacio-tiempo -->
        <div class="spacetime-grid" id="spacetimeGrid"></div>

        <!-- Efecto de distorsión radial -->
        <div class="distortion-field"></div>
        
        <div class="title">GARGANTÚA</div>
        
        <!-- Discos de acreción conformados por corazones -->
        <div class="hearts-accretion" id="accretionHearts1"></div>
        <div class="hearts-accretion-2" id="accretionHearts2"></div>
        <div class="hearts-accretion-3" id="accretionHearts3"></div>
        
        <!-- Evento horizonte (agujero negro) -->
        <div class="event-horizon"></div>
        
        <div class="subtitle">~ Interstellar ~</div>
    </div>
    
    <script>
        // Crear grid de deformación del espacio-tiempo
        function createSpacetimeGrid() {
            const grid = document.getElementById('spacetimeGrid');
            const gridSize = 40;
            const gridCount = Math.ceil(800 / gridSize);

            // Líneas horizontales
            for (let i = 0; i < gridCount; i++) {
                const line = document.createElement('div');
                line.className = 'grid-line grid-line-h';
                line.style.top = (i * gridSize) + 'px';
                line.style.left = '0';
                grid.appendChild(line);
            }

            // Líneas verticales
            for (let i = 0; i < gridCount; i++) {
                const line = document.createElement('div');
                line.className = 'grid-line grid-line-v';
                line.style.left = (i * gridSize) + 'px';
                line.style.top = '0';
                grid.appendChild(line);
            }
        }

        // Función para crear disco de acreción de corazones
        function createHeartAccretionDisk(elementId, numHearts, heartClass, colorClass) {
            const container = document.getElementById(elementId);
            const radius = container.offsetWidth / 2 - 30;

            for (let i = 0; i < numHearts; i++) {
                const angle = (i / numHearts) * Math.PI * 2;
                const heart = document.createElement('div');
                heart.className = heartClass;

                // Determinar color según la capa
                if (colorClass === 'layer1') {
                    heart.style.color = 'rgba(0, 255, 200, 0.85)';
                } else if (colorClass === 'layer2') {
                    heart.style.color = 'rgba(0, 200, 255, 0.8)';
                } else {
                    heart.style.color = 'rgba(100, 200, 255, 0.75)';
                }

                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;

                heart.style.left = (container.offsetWidth / 2 + x - 12.5) + 'px';
                heart.style.top = (container.offsetHeight / 2 + y - 12.5) + 'px';
                
                // Efecto de distorsión individual
                heart.style.animation = `warp ${2 + Math.random() * 1}s ease-in-out infinite`;
                heart.style.animationDelay = (Math.random() * 2) + 's';

                container.appendChild(heart);
            }
        }

        // Crear el grid
        createSpacetimeGrid();

        // Crear discos de acreción
        createHeartAccretionDisk('accretionHearts1', 16, 'heart-accent', 'layer1');
        createHeartAccretionDisk('accretionHearts2', 12, 'heart-accent-2', 'layer2');
        createHeartAccretionDisk('accretionHearts3', 10, 'heart-accent-3', 'layer3');
    </script>
</body>
</html>
